name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify scores API contract
        run: |
          for route in scores practice-time card-memory typing; do
            curl --fail --silent --show-error --retry 3 "$SCORE_API_URL/$route" > /dev/null
          done
        env:
          SCORE_API_URL: ${{ vars.SCORE_API_URL }}
      - name: Configure scores
        run: sed -i "s|data-score-api|data-score-api=\"$SCORE_API_URL\"|" public/mental-math/index.html public/card-memory/index.html public/typing/index.html
        env:
          SCORE_API_URL: ${{ vars.SCORE_API_URL }}
      - name: Configure Spotify
        run: sed -i "s|data-spotify-api|data-spotify-api=\"$SPOTIFY_API_URL\"|" public/music/index.html public/podcasts/index.html
        env:
          SPOTIFY_API_URL: ${{ vars.SPOTIFY_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
