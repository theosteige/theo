<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Media section mockup</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #000; }

      #media {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 0;
      }

      #media button {
        min-width: 0;
        aspect-ratio: 1;
        padding: 0;
        border: 0;
        overflow: hidden;
        background: #000;
        color: #fff;
        cursor: pointer;
      }

      #media img,
      #media video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #media audio { width: 90%; }

      dialog {
        width: 100vw;
        max-width: none;
        height: 100vh;
        max-height: none;
        margin: 0;
        padding: 0;
        border: 0;
        background: #000;
        color: #fff;
      }

      dialog::backdrop { background: #000; }

      #viewer {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
      }

      #viewer img,
      #viewer video,
      #viewer iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        object-fit: contain;
      }

      #viewer audio { width: min(600px, 90vw); }

      #close {
        position: fixed;
        z-index: 1;
        top: 0;
        right: 0;
        width: 48px;
        height: 48px;
        border: 0;
        background: #000;
        color: #fff;
        font: 32px/1 sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main id="media" aria-label="Media">
      <button type="button" data-kind="image" data-src="/images/home/fish-sunset.jpg" aria-label="View sunset fishing photo">
        <img src="/images/home/fish-sunset.jpg" alt="Fishing from a boat at sunset" />
      </button>

      <button type="button" data-kind="video" data-src="/videos/home/card-trick.mp4" aria-label="View card trick video">
        <video muted autoplay loop playsinline poster="/images/home/card-trick-poster.jpg">
          <source src="/videos/home/card-trick.mp4" type="video/mp4" />
        </video>
      </button>

      <button type="button" data-kind="image" data-src="/images/home/friends-formal.jpg" aria-label="View friends photo">
        <img src="/images/home/friends-formal.jpg" alt="Friends standing together outdoors" />
      </button>

      <button type="button" data-kind="audio" data-src="/videos/home/computer.mp4" aria-label="Open audio player">
        <audio controls tabindex="-1" aria-hidden="true">
          <source src="/videos/home/computer.mp4" type="video/mp4" />
        </audio>
      </button>

      <button type="button" data-kind="image" data-src="/images/home/baseball.jpg" aria-label="View baseball photo">
        <img src="/images/home/baseball.jpg" alt="Baseball senior day" />
      </button>

      <button type="button" data-kind="file" data-src="/resume/theo-steiger-resume.pdf" aria-label="View PDF">
        PDF
      </button>

      <button type="button" data-kind="video" data-src="/videos/home/computer.mp4" aria-label="View computer video">
        <video muted autoplay loop playsinline poster="/images/home/computer-poster.jpg">
          <source src="/videos/home/computer.mp4" type="video/mp4" />
        </video>
      </button>

      <button type="button" data-kind="image" data-src="/images/home/fish-boat.jpg" aria-label="View fishing photo">
        <img src="/images/home/fish-boat.jpg" alt="Holding a striped bass on a fishing boat" />
      </button>
    </main>

    <dialog id="dialog" aria-label="Media viewer">
      <button id="close" type="button" aria-label="Close viewer">&times;</button>
      <div id="viewer"></div>
    </dialog>

    <script>
      const dialog = document.querySelector("#dialog");
      const viewer = document.querySelector("#viewer");
      const close = document.querySelector("#close");

      document.querySelector("#media").addEventListener("click", (event) => {
        const item = event.target.closest("button[data-kind]");
        if (!item) return;

        const kind = item.dataset.kind;
        const src = item.dataset.src;
        let media;

        if (kind === "image") {
          media = new Image();
          media.alt = item.querySelector("img")?.alt ?? "";
        } else if (kind === "video") {
          media = document.createElement("video");
          media.controls = true;
          media.autoplay = true;
          media.playsInline = true;
        } else if (kind === "audio") {
          media = document.createElement("audio");
          media.controls = true;
          media.autoplay = true;
        } else {
          media = document.createElement("iframe");
          media.title = "File viewer";
        }

        media.src = src;
        viewer.replaceChildren(media);
        dialog.showModal();
      });

      close.addEventListener("click", () => dialog.close());

      dialog.addEventListener("click", (event) => {
        if (event.target === dialog) dialog.close();
      });

      dialog.addEventListener("close", () => viewer.replaceChildren());

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && dialog.open) dialog.close();
      });
    </script>
  </body>
</html>
