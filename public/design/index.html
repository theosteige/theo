<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="A collection of media." />
    <meta property="og:description" content="A collection of media." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="/favicon-blue-t.svg"
    />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#0645ad" />
    <link
      rel="apple-touch-icon"
      sizes="512x512"
      href="/favicon-512.png?v=20260831"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://theosteiger.com/favicon-512.png"
    />
    <meta property="og:image:alt" content="Blue underlined letter T on white" />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:image"
      content="https://theosteiger.com/favicon-512.png"
    />
    <meta property="og:url" content="https://theosteiger.com/design/" />
    <link rel="canonical" href="https://theosteiger.com/design/" />
    <meta property="og:title" content="Design | Theo Steiger" />
    <title>Design | Theo Steiger</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/design.css" />
  </head>
  <body class="viewport-layout">
    <header>
      <div>
        <a href="/">Table of Contents</a> ·
        <a href="/side-quests/">Side Quests</a>
      </div>
      <ul class="contact-list" aria-label="Contact links">
        <li>
          <button
            class="contact-button"
            type="button"
            data-reveal="me@theosteiger.com"
          >
            Email
          </button>
        </li>
        <li><a href="https://github.com/theosteige">GitHub</a></li>
        <li>
          <a href="https://www.linkedin.com/in/theodore-steiger/">LinkedIn</a>
        </li>
      </ul>
    </header>
    <main>
      <section id="media" aria-label="Design">
        <button
          type="button"
          data-kind="audio"
          data-loop
          data-src="/audio/mood/fakemink-crush-prod-ok_5fvYtsp6.mp3"
          aria-label="Open looping audio player"
        >
          <audio
            controls
            loop
            preload="none"
            tabindex="-1"
            aria-hidden="true"
          >
            <source
              src="/audio/mood/fakemink-crush-prod-ok_5fvYtsp6.mp3"
              type="audio/mpeg"
            />
          </audio>
        </button>
        <button
          type="button"
          data-kind="audio"
          data-loop
          data-src="/audio/mood/girlfriends-untitled-3.mp3"
          aria-label="Open looping Girlfriends Untitled 3 audio player"
        >
          <audio
            controls
            loop
            preload="none"
            tabindex="-1"
            aria-hidden="true"
          >
            <source
              src="/audio/mood/girlfriends-untitled-3.mp3"
              type="audio/mpeg"
            />
          </audio>
        </button>
        <button
          type="button"
          data-kind="video"
          data-src="/videos/mood/cannes-oxygen-tanks.mp4"
          aria-label="Open Cannes film video"
        >
          <img
            src="/images/design/cannes-oxygen-tanks.jpg"
            alt="Cannes film video thumbnail"
            width="540"
            height="960"
            decoding="async"
          />
        </button>
        <button
          type="button"
          data-kind="video"
          data-src="/videos/mood/james-murphy-interview.mp4"
          aria-label="Open James Murphy interview video"
        >
          <img
            src="/images/design/james-murphy-interview.jpg"
            alt="James Murphy interview video thumbnail"
            width="921"
            height="960"
            decoding="async"
          />
        </button>
        <button
          type="button"
          data-kind="video"
          data-src="/videos/mood/shibuya-halloween.mp4"
          aria-label="Open Shibuya Halloween short film"
        >
          <img
            src="/images/design/shibuya-halloween.jpg"
            alt="Shibuya Halloween short film thumbnail"
            width="540"
            height="960"
            decoding="async"
          />
        </button>
        <button
          type="button"
          data-kind="video"
          data-src="/videos/mood/travis-virgil-kanye.mp4"
          aria-label="Open Travis Scott, Virgil Abloh, and Kanye West video"
        >
          <img
            src="/images/design/travis-virgil-kanye.jpg"
            alt="Travis Scott, Virgil Abloh, and Kanye West video thumbnail"
            width="960"
            height="960"
            decoding="async"
          />
        </button>
        <button
          type="button"
          data-kind="video"
          data-src="/videos/mood/parts-where-wholes.mp4"
          aria-label="Open Parts Where Wholes Are Described As Such video"
        >
          <img
            src="/images/design/parts-where-wholes.jpg"
            alt="Parts Where Wholes Are Described As Such video thumbnail"
            width="540"
            height="960"
            decoding="async"
          />
        </button>
        <button
          type="button"
          data-kind="video"
          data-src="/videos/mood/infohazard.mp4"
          aria-label="Open infohazard video"
        >
          <img
            src="/images/design/infohazard.jpg"
            alt="Infohazard video thumbnail"
            width="960"
            height="622"
            decoding="async"
          />
        </button>
        <button
          type="button"
          data-kind="video"
          data-src="/videos/mood/dance-or-die.mp4"
          aria-label="Open Dance or Die video"
        >
          <img
            src="/images/design/dance-or-die.jpg"
            alt="Dance or Die video thumbnail"
            width="540"
            height="960"
            decoding="async"
          />
        </button>
        <button
          type="button"
          data-kind="image"
          data-src="/images/mood/emirshiro-collage-4.jpg"
          aria-label="Open fish and eye collage"
        >
          <img
            src="/images/mood/emirshiro-collage-4.jpg"
            srcset="
              /images/mood/emirshiro-collage-4-480.jpg  480w,
              /images/mood/emirshiro-collage-4-960.jpg  960w,
              /images/mood/emirshiro-collage-4.jpg     1170w
            "
            sizes="50vw"
            alt="Surreal collage of an eye and a goldfish"
            width="1170"
            height="1560"
            decoding="async"
          />
        </button>
        <button
          type="button"
          data-kind="image"
          data-src="/images/mood/emirshiro-collage-3.jpg"
          aria-label="Open skin and galaxy collage"
        >
          <img
            src="/images/mood/emirshiro-collage-3.jpg"
            srcset="
              /images/mood/emirshiro-collage-3-480.jpg  480w,
              /images/mood/emirshiro-collage-3-960.jpg  960w,
              /images/mood/emirshiro-collage-3.jpg     1170w
            "
            sizes="50vw"
            alt="Surreal collage pairing skin with a galaxy"
            width="1170"
            height="1560"
            decoding="async"
          />
        </button>
        <button
          type="button"
          data-kind="image"
          data-src="/images/mood/emirshiro-collage-2.jpg"
          aria-label="Open giraffe and hand collage"
        >
          <img
            src="/images/mood/emirshiro-collage-2.jpg"
            srcset="
              /images/mood/emirshiro-collage-2-480.jpg  480w,
              /images/mood/emirshiro-collage-2-960.jpg  960w,
              /images/mood/emirshiro-collage-2.jpg     1170w
            "
            sizes="50vw"
            alt="Surreal collage of a giraffe and a hand"
            width="1170"
            height="1560"
            decoding="async"
          />
        </button>
        <button
          type="button"
          data-kind="image"
          data-src="/images/mood/emirshiro-collage-1.jpg"
          aria-label="Open fish and kiss collage"
        >
          <img
            src="/images/mood/emirshiro-collage-1.jpg"
            srcset="
              /images/mood/emirshiro-collage-1-480.jpg  480w,
              /images/mood/emirshiro-collage-1-960.jpg  960w,
              /images/mood/emirshiro-collage-1.jpg     1170w
            "
            sizes="50vw"
            alt="Surreal collage of a red fish and two people kissing"
            width="1170"
            height="1560"
            decoding="async"
          />
        </button>
      </section>
      <dialog id="dialog" aria-label="Media viewer">
        <button id="close" type="button" aria-label="Close viewer">
          &times;
        </button>
        <div id="viewer"></div>
      </dialog>
      <script src="/design.js"></script>
    </main>
    <script src="/site.js"></script>
  </body>
</html>
