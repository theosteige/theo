<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="What Theo is currently listening to and notes about music.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://theosteiger.com/music/">
  <title>Music | Theo Steiger</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-spotify-api>
  <header>
    <div><a href="/">Table of Contents</a></div>
    <ul class="contact-list" aria-label="Contact links">
      <li><button class="contact-button" type="button" data-reveal="me@theosteiger.com">Email</button></li>
      <li><a href="https://github.com/theosteige">GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/theodore-steiger/">LinkedIn</a></li>
    </ul>
  </header>
  <main>
    <section class="intro">
      <h1>Music</h1>
      <p>What I am listening to, with more to come.</p>
    </section>
    <section class="listening-section" data-now-playing data-kind="all" aria-labelledby="now-playing-heading">
      <div class="listening-heading">
        <div>
          <p class="eyebrow">Spotify</p>
          <h2 id="now-playing-heading">Currently listening</h2>
        </div>
        <p class="listening-updated" data-updated aria-live="polite"></p>
      </div>
      <p class="listening-message" data-message role="status">Checking Spotify…</p>
      <a class="listening-card" data-card href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer" hidden>
        <img class="listening-artwork" data-artwork alt="" width="160" height="160">
        <span class="listening-details">
          <span class="listening-state"><span class="listening-dot" aria-hidden="true"></span><span data-state>Listening now</span></span>
          <strong class="listening-title" data-title></strong>
          <span class="listening-creator" data-creator></span>
          <span class="listening-progress" data-progress-wrap hidden>
            <progress data-progress max="1" value="0"></progress>
            <span class="listening-times"><span data-elapsed>0:00</span><span data-duration>0:00</span></span>
          </span>
          <span class="spotify-link">Open in Spotify <span aria-hidden="true">↗</span></span>
        </span>
      </a>
      <p class="spotify-attribution">Playback information supplied by Spotify.</p>
    </section>
  </main>
  <script src="/site.js"></script>
  <script src="/now-playing.js"></script>
</body>
</html>
